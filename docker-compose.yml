name: shinkou-insight

services:
  ai-service:
    build:
      context: ./apps/ai-service
    restart: unless-stopped
    environment:
      APP_NAME: ai-service
      APP_ENV: ${APP_ENV:-local}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-dev-key}
      LLM_MODE: ${LLM_MODE:-http}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_STRUCTURED_OUTPUT_METHOD: ${LLM_STRUCTURED_OUTPUT_METHOD:-json_schema}
      RETRIEVER_MODE: ${RETRIEVER_MODE:-milvus}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      MILVUS_URI: ${AI_MILVUS_URI:-http://milvus:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_DB_NAME: ${MILVUS_DB_NAME:-default}
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME:-shinkou_knowledge_chunks}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-embedding-v1}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-false}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-brave}
      WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-https://api.search.brave.com/res/v1/web/search}
      WEB_SEARCH_LANGUAGE: ${WEB_SEARCH_LANGUAGE:-zh-hans}
      STORAGE_MODE: ${STORAGE_MODE:-minio}
      MINIO_ENDPOINT: ${AI_MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-shinkou_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-shinkou_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-shinkou-files}
      GRAPH_MODE: ${GRAPH_MODE:-memory}
      GRAPH_EXTRACTION_MODE: ${GRAPH_EXTRACTION_MODE:-heuristic}
      NEO4J_URI: ${AI_NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-shinkou_graph_password}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-shinkou_dev_password}@postgres:5432/${POSTGRES_DB:-shinkou_insight}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_URL: ${AI_MCP_URL:-http://mcp-server:8001/mcp}
      MCP_API_KEY: ${MCP_API_KEY:-local-dev-key}
      MCP_ALLOWED_TOOLS: ${MCP_ALLOWED_TOOLS:-search_knowledge,search_graph}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-15}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - shinkou-infra

  mcp-server:
    profiles: ["mcp"]
    build:
      context: ./apps/ai-service
    restart: unless-stopped
    command: ["python", "mcp_server.py"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-dev-key}
      MCP_API_KEY: ${MCP_API_KEY:-local-dev-key}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      RETRIEVER_MODE: ${RETRIEVER_MODE:-milvus}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-shinkou_dev_password}@postgres:5432/${POSTGRES_DB:-shinkou_insight}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      MILVUS_URI: ${AI_MILVUS_URI:-http://milvus:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_DB_NAME: ${MILVUS_DB_NAME:-default}
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME:-shinkou_knowledge_chunks}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-embedding-v1}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
    ports:
      - "${MCP_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - shinkou-infra

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shinkou_insight}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shinkou_dev_password}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shinkou-infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: ["etcd", "-advertise-client-urls=http://milvus-etcd:2379", "-listen-client-urls", "http://0.0.0.0:2379", "--data-dir", "/etcd"]
    volumes:
      - milvus-etcd-data:/etcd
    networks:
      - shinkou-infra
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 10s
      retries: 12

  milvus-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TZ: ${TZ:-Asia/Shanghai}
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - milvus-minio-data:/minio_data
    networks:
      - shinkou-infra
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 12

  milvus:
    image: milvusdb/milvus:v2.4.23
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      TZ: ${TZ:-Asia/Shanghai}
    command: ["milvus", "run", "standalone"]
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_WEB_PORT:-19091}:9091"
    networks:
      - shinkou-infra
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-shinkou_redis_password}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-shinkou_redis_password}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - shinkou-infra
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-shinkou_graph_password}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
      NEO4J_server_bolt_advertised__address: localhost:${NEO4J_BOLT_PORT:-7687}
      NEO4J_server_http_advertised__address: localhost:${NEO4J_HTTP_PORT:-7474}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    networks:
      - shinkou-infra
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-shinkou_graph_password}' 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shinkou_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shinkou_minio_password}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - shinkou-infra
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shinkou_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shinkou_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-shinkou-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
        mc anonymous set none "local/$${MINIO_BUCKET}"
    networks:
      - shinkou-infra

volumes:
  postgres-data:
    name: shinkou-postgres-data
  redis-data:
    name: shinkou-redis-data
  neo4j-data:
    name: shinkou-neo4j-data
  neo4j-logs:
    name: shinkou-neo4j-logs
  neo4j-import:
    name: shinkou-neo4j-import
  neo4j-plugins:
    name: shinkou-neo4j-plugins
  minio-data:
    name: shinkou-minio-data
  milvus-etcd-data:
    name: shinkou-milvus-etcd-data
  milvus-minio-data:
    name: shinkou-milvus-minio-data
  milvus-data:
    name: shinkou-milvus-data

networks:
  shinkou-infra:
    name: shinkou-infra
