server:
  port: 8080
  servlet:
    session:
      timeout: ${SHINKOU_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SHINKOU_COOKIE_SECURE:false}

spring:
  application:
    name: Shinkou-Insight

  # 本地开发时允许从项目根目录 .env 读取 SHINKOU_* 配置；密钥文件不提交到仓库。
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # PostgreSQL
  datasource:
    url: ${SHINKOU_DB_URL:jdbc:postgresql://localhost:15432/shinkou_insight}
    username: ${SHINKOU_DB_USERNAME:postgres}
    password: ${SHINKOU_DB_PASSWORD:shinkou_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SHINKOU_DB_POOL_MAX:20}
      minimum-idle: ${SHINKOU_DB_POOL_MIN:5}
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 0

  # Redis
  data:
    redis:
      host: localhost
      port: ${SHINKOU_REDIS_PORT:16379}
      database: 0
      password: ${SHINKOU_REDIS_PASSWORD:shinkou_redis_password}
      timeout: 3000ms

  flyway:
    enabled: true

shinkou:
  storage:
    minio:
      endpoint: ${SHINKOU_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${SHINKOU_MINIO_ACCESS_KEY:shinkou_minio}
      secret-key: ${SHINKOU_MINIO_SECRET_KEY:shinkou_minio_password}
      bucket: ${SHINKOU_MINIO_BUCKET:shinkou-files}
  graph:
    neo4j:
      uri: ${SHINKOU_NEO4J_URI:bolt://localhost:7687}
      username: ${SHINKOU_NEO4J_USERNAME:neo4j}
      password: ${SHINKOU_NEO4J_PASSWORD:shinkou_graph_password}
  ai:
    base-url: ${SHINKOU_AI_SERVICE_URL:http://localhost:8003}
    internal-api-key: ${SHINKOU_AI_INTERNAL_API_KEY:local-dev-key}
    callback-base-url: ${SHINKOU_AI_CALLBACK_BASE_URL:http://localhost:8080}
  security:
    environment: ${SHINKOU_ENVIRONMENT:development}
    # Vite 默认使用 5173，4173/4174 用于本地预览或端口自动切换。
    allowed-origins: ${SHINKOU_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173,http://localhost:4174,http://127.0.0.1:4174,http://localhost:4175,http://127.0.0.1:4175}
    encryption-key: ${SHINKOU_ENCRYPTION_KEY:}
    auth:
      login-requests-per-ip: ${SHINKOU_AUTH_LOGIN_REQUESTS_PER_IP:30}
      login-request-window: ${SHINKOU_AUTH_LOGIN_REQUEST_WINDOW:5m}
      login-failures-per-account-ip: ${SHINKOU_AUTH_LOGIN_FAILURES_PER_ACCOUNT_IP:5}
      login-failure-window: ${SHINKOU_AUTH_LOGIN_FAILURE_WINDOW:15m}
      sms-requests-per-ip: ${SHINKOU_AUTH_SMS_REQUESTS_PER_IP:20}
      sms-requests-per-phone: ${SHINKOU_AUTH_SMS_REQUESTS_PER_PHONE:3}
      sms-request-window: ${SHINKOU_AUTH_SMS_REQUEST_WINDOW:10m}
      sms-cooldown: ${SHINKOU_AUTH_SMS_COOLDOWN:60s}
      captcha-requests-per-ip: ${SHINKOU_AUTH_CAPTCHA_REQUESTS_PER_IP:30}
      captcha-request-window: ${SHINKOU_AUTH_CAPTCHA_REQUEST_WINDOW:1m}
      password-mutations-per-user: ${SHINKOU_AUTH_PASSWORD_MUTATIONS_PER_USER:5}
      password-mutation-window: ${SHINKOU_AUTH_PASSWORD_MUTATION_WINDOW:15m}
      max-active-sessions-per-user: ${SHINKOU_AUTH_MAX_ACTIVE_SESSIONS:5}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
