upstream shinkou_backend {
    zone shinkou_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match Spring's multipart cap, with room for multipart headers.
    client_max_body_size 257m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # The trailing slash removes /api/, matching the Vite development proxy.
        proxy_pass http://shinkou_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Research and agent endpoints stream SSE events over long connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
